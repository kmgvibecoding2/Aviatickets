<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подешевле</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Roboto+Condensed:wght@600;700&display=swap">
<style>
/* Layout: одна колонка. Форма поиска, затем календарь цен по дням как главный элемент, затем список предложений. */
:root{
  --bg:#eaf0f6;
  --surface:#ffffff;
  --ink:#10244a;
  --muted:#5a6b88;
  --line:#d3dde9;
  --bar:#9db6d6;
  --amber:#f5a623;
  --amber-ink:#2a1a00;
  --teal:#0f8f86;
  --teal-bg:#dff4f1;
  --danger:#b3261e;
  --font-display:"Roboto Condensed","PT Sans",Arial,sans-serif;
  --font-body:"PT Sans",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1627;--surface:#14233b;--ink:#e7eefa;--muted:#9fb0cc;--line:#26395a;
    --bar:#3d5d8a;--amber:#f7b447;--amber-ink:#2a1a00;--teal:#43d1c5;--teal-bg:#10413f;--danger:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1627;--surface:#14233b;--ink:#e7eefa;--muted:#9fb0cc;--line:#26395a;
  --bar:#3d5d8a;--amber:#f7b447;--amber-ink:#2a1a00;--teal:#43d1c5;--teal-bg:#10413f;--danger:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,.logo{font-family:var(--font-display);text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px}
.logo{font-size:1.7rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{width:14px;height:14px;background:var(--amber);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:block}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:var(--amber-ink);padding:3px 9px;border-radius:99px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.hero h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;margin:0 0 6px;font-weight:700}
.hero p{margin:0;color:var(--muted);max-width:60ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
form.search{display:flex;flex-direction:column;gap:14px}
.trip{display:flex;gap:6px;flex-wrap:wrap}
.trip label{cursor:pointer}
.trip input{position:absolute;opacity:0;pointer-events:none}
.trip span{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-weight:700;color:var(--muted)}
.trip input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.trip input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.route{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
@media (max-width:560px){.route{grid-template-columns:1fr}.swap{justify-self:center}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.f input:disabled{opacity:.45}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.f{position:relative}
.lb{position:absolute;top:100%;left:0;right:0;z-index:20;margin:4px 0 0;padding:4px;list-style:none;max-height:260px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,25,60,.18)}
.lb li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.lb li span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.lb li[aria-selected="true"],.lb li:hover{background:var(--bg)}
.lb .none{color:var(--muted);cursor:default}
.paxbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{position:absolute;top:100%;right:0;z-index:20;margin-top:4px;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px 12px;box-shadow:0 8px 24px rgba(10,25,60,.18)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow b{display:block}.prow span{font-size:.85rem;color:var(--muted)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:1.5ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pnote{margin:8px 0 0;font-size:.8rem;color:var(--muted)}
.err{color:var(--danger);font-weight:700;min-height:1.3em;margin:0}
.go{background:var(--amber);color:var(--amber-ink);border:0;border-radius:10px;font-weight:700;font-size:1.05rem;padding:11px 22px;min-height:44px;cursor:pointer}
.go:hover{filter:brightness(1.06)}

.cal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{margin:0;font-size:1.5rem}
.cal-head small{color:var(--muted);display:block;font-size:.9rem}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.nav b{min-width:9.5ch;text-align:center;text-transform:capitalize}
.picked{font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin-bottom:8px;min-height:1.6em}
.picked em{font-style:normal;color:var(--teal)}
.chart{overflow-x:auto;padding-bottom:4px}
.bars{display:flex;gap:3px;align-items:flex-end;min-width:calc(var(--n)*24px);height:190px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer}
.bar .col{width:100%;background:var(--bar);border-radius:5px 5px 0 0;transition:filter .15s}
.bar:hover .col{filter:brightness(1.12)}
.bar.cheap .col{background:var(--amber)}
.bar.sel{outline:2px solid var(--ink);outline-offset:1px;border-radius:5px}
.bar:disabled{cursor:not-allowed;opacity:.3}
.bar .d{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.bar .w{font-size:.62rem;color:var(--muted);line-height:1;text-transform:uppercase}
.bar.we .d,.bar.we .w{color:var(--danger)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

.tools{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tools .grp{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.tools label{display:flex;gap:8px;align-items:center}
.tools input[type=range]{accent-color:var(--amber);width:160px}
.tools select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.notice{background:var(--teal-bg);border-radius:10px;padding:10px 14px;font-size:.92rem}
.notice.warn{background:color-mix(in srgb,var(--amber) 22%,var(--surface))}

.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.offer{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.offer.best{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
@media (max-width:600px){.offer{grid-template-columns:1fr}}
.legs{display:flex;flex-direction:column;gap:12px;min-width:0}
.leg{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr;gap:12px;align-items:center}
@media (max-width:480px){.leg{grid-template-columns:1fr}}
.al b{display:block}
.al span{font-size:.85rem;color:var(--muted)}
.tl{display:flex;align-items:center;gap:10px;min-width:0}
.tl .t{font-family:var(--font-display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.tl .t small{font-size:.7rem;color:var(--muted);font-family:var(--font-body)}
.tl .t em{display:block;font-family:var(--font-body);font-style:normal;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.line{flex:1;min-width:48px;text-align:center;font-size:.78rem;color:var(--muted)}
.line::after{content:"";display:block;height:2px;background:var(--line);margin-top:3px;position:relative}
.stops{color:var(--teal);font-weight:700}
.stops.n{color:var(--muted)}
.buy{display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center;border-left:1px dashed var(--line);padding-left:14px}
@media (max-width:600px){.buy{border-left:0;border-top:1px dashed var(--line);padding:12px 0 0;align-items:stretch}}
.price{font-family:var(--font-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:var(--amber-ink);padding:2px 8px;border-radius:99px;align-self:flex-start}
.prov{font-size:.85rem;color:var(--teal);font-weight:700}
.also{font-size:.8rem;color:var(--muted);text-align:right}
@media (max-width:600px){.also{text-align:left}}
.buy button{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;min-height:44px}
.empty{text-align:center;color:var(--muted);padding:30px 16px}

footer{color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
footer p{margin:0;max-width:75ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;max-width:calc(100% - 32px);z-index:5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i></i><span>Подешевле</span></div>
    <div class="hright">
      <span class="demo" id="demoBadge"></span>
      <div class="lang" role="group" aria-label="Тіл / Язык">
        <button type="button" data-lang="kk" aria-pressed="false">Қазақша</button>
        <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <h1 id="h1"></h1>
    <p id="lead"></p>
  </section>

  <form class="card search" id="form" novalidate>
    <div class="trip" role="radiogroup" id="trip">
      <label><input type="radio" name="trip" value="rt" checked><span id="tRt"></span></label>
      <label><input type="radio" name="trip" value="ow"><span id="tOw"></span></label>
    </div>
    <div class="fields">
      <div class="route">
        <div class="f"><label for="from" id="lFrom"></label><input id="from" role="combobox" aria-expanded="false" aria-controls="lb-from" autocomplete="off"><ul class="lb" id="lb-from" role="listbox" hidden></ul></div>
        <button type="button" class="swap" id="swap">⇄</button>
        <div class="f"><label for="to" id="lTo"></label><input id="to" role="combobox" aria-expanded="false" aria-controls="lb-to" autocomplete="off"><ul class="lb" id="lb-to" role="listbox" hidden></ul></div>
      </div>
      <div class="f"><label for="dep" id="lDep"></label><input id="dep" type="date"></div>
      <div class="f"><label for="ret" id="lRet"></label><input id="ret" type="date"></div>
      <div class="f paxf"><label for="paxBtn" id="lPax"></label><button type="button" id="paxBtn" class="paxbtn" aria-expanded="false" aria-controls="paxPop"></button><div class="pop" id="paxPop" hidden></div></div>
      <button class="go" id="go" type="submit"></button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </form>

  <section class="card" aria-labelledby="calT">
    <div class="cal-head">
      <div><h2 id="calT"></h2><small id="calS"></small></div>
      <div class="nav">
        <button type="button" id="prev" aria-label="←">‹</button>
        <b id="mon"></b>
        <button type="button" id="next" aria-label="→">›</button>
      </div>
    </div>
    <div class="picked" id="picked" aria-live="polite"></div>
    <div class="chart"><div class="bars" id="bars"></div></div>
    <div class="legend"><span><i style="background:var(--amber)"></i><span id="lgCheap"></span></span><span><i style="background:var(--bar)"></i><span id="lgOther"></span></span><span id="lgNote"></span></div>
  </section>

  <section aria-labelledby="resT" style="display:flex;flex-direction:column;gap:14px">
    <div class="tools card" style="padding:12px 16px">
      <h2 id="resT" style="margin:0;font-size:1.3rem"></h2>
      <div class="grp">
        <label><input type="checkbox" id="direct"><span id="lDirect"></span></label>
        <label><span id="lMax"></span><input type="range" id="max"><b id="maxV"></b></label>
        <select id="sort" aria-label="sort"></select>
      </div>
    </div>
    <div class="notice warn" id="partial" hidden></div>
    <ul class="list" id="list"></ul>
  </section>

  <footer>
    <p id="disc"></p>
    <p id="rate"></p>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>

// helpers
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(seed);return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const money=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₸';

function dist(a,b){const R=6371,r=Math.PI/180,[,,la1,lo1]=C[a],[,,la2,lo2]=C[b];
 const x=Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function dayPrice(a,b,d){
 const km=dist(a,b),days=Math.round((d-today)/864e5);
 const ahead=days<7?1.5:days<14?1.25:days<30?1.1:1;
 const noise=.92+rng(a+b+iso(d))()*.16;
 return Math.round((9000+km*13)*DOW[d.getDay()]*SEASON[d.getMonth()]*ahead*noise/100)*100;
}

function applyPax(){S.pax=S.adt+.75*S.chd+.1*S.inf;S.cnt=S.adt+S.chd+S.inf}
function gap(){return S.rt?Math.max(1,Math.round((S.ret-S.dep)/864e5)):0}
function calPrice(d){const p=dayPrice(S.a,S.b,d);return S.rt?p+dayPrice(S.b,S.a,addDays(d,gap())):p}

function leg(a,b,d,r,k,stops,transfer,al){
 const km=dist(a,b);
 const dur=Math.round(km/800*60+40+(stops?90+r()*90:0));
 const start=Math.round((5+r()*16)*4)*15; // minutes from midnight
 return{from:a,to:b,start,dur,arr:(start+dur)%1440,plus:Math.floor((start+dur)/1440),stops,transfer,al,no:al[1]+' '+(100+Math.floor(r()*900))};
}
function makeOffers(){
 const key=S.a+S.b+iso(S.dep)+(S.rt?iso(S.ret):'');
 const r=rng(key),km=dist(S.a,S.b),out=[];
 const base=calPrice(S.dep),n=7;
 for(let i=0;i<n;i++){
  const k=i===0?0:.04+r()*.5;
  const stops=km<700?0:(r()<.5?0:1);
  const hubs=HUBS.filter(h=>h!==S.a&&h!==S.b);
  const tr=hubs[Math.floor(r()*hubs.length)];
  const al=AIR[Math.floor(r()*AIR.length)];
  const legs=[leg(S.a,S.b,S.dep,r,k,stops,tr,al)];
  if(S.rt)legs.push(leg(S.b,S.a,S.ret,r,k,stops,tr,al));
  const price=Math.round(base*(1+k)/100)*100;
  const np=2+Math.floor(r()*3),pool=PROV.slice(),prov=[];
  for(let j=0;j<np;j++)prov.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  const ps=prov.map((p,j)=>({p,price:j===0?price:Math.round(price*(1+.01+r()*.08)/100)*100})).sort((x,y)=>x.price-y.price);
  out.push({legs,price,ps,dur:legs.reduce((s,l)=>s+l.dur,0)});
 }
 offers=out;
 const mx=Math.max(...out.map(o=>o.price*S.pax));
 const mn=Math.min(...out.map(o=>o.price*S.pax));
 const m=$('max');m.min=mn;m.max=mx;m.step=100;m.value=mx;S.max=mx;
 S.partial=hash(key)%4===0;
}

function resolve(v){
 v=v.trim().toLowerCase();if(!v)return null;

  const q=(filter||'').trim().toLowerCase();
  shown=Object.keys(C).filter(c=>!q||C[c][0].toLowerCase().includes(q)||C[c][1].toLowerCase().includes(q)||c.toLowerCase().includes(q));
  shown.sort((x,y)=>cn(x).localeCompare(cn(y),loc()));

  lb.innerHTML=shown.length?shown.map(c=>`<li role="option" data-c="${c}"><b style="font-weight:400">${cn(c)}</b><span>${c}</span></li>`).join(''):`<li class="none">${L().none}</li>`;

 };
 const close=()=>{lb.hidden=true;inp.setAttribute('aria-expanded','false')};
 const pick=c=>{inp.value=label(c);close()};
 const mark=()=>{[...lb.children].forEach((li,i)=>li.setAttribute('aria-selected',i===idx));const el=lb.children[idx];if(el)el.scrollIntoView({block:'nearest'})};
 inp.addEventListener('focus',()=>{inp.select();open('')});

  if(e.key==='ArrowDown'){e.preventDefault();if(lb.hidden)open(inp.value);idx=Math.min(idx+1,shown.length-1);mark()}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);mark()}
  else if(e.key==='Enter'&&!lb.hidden&&idx>=0){e.preventDefault();pick(shown[idx])}
  else if(e.key==='Escape')close();
 });
 lb.addEventListener('mousedown',e=>{e.preventDefault();const li=e.target.closest('[data-c]');if(li)pick(li.dataset.c)});
}
